name: Build & deploy

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Code health: typecheck, tests, production build. Stays green regardless of
  # whether GitHub Pages is enabled for the repository.
  build:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          VITE_BASE: /trip-planner/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Publishes to GitHub Pages. Requires Pages to be enabled for the repository
  # with "GitHub Actions" as the source (Settings → Pages); on a private
  # repository that also needs a plan that includes Pages, or the repository
  # can be made public.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - id: deployment
        uses: actions/deploy-pages@v4
